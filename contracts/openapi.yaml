openapi: 3.1.0
info:
  title: 高二英语智能练习系统 API
  version: 1.0.0
  description: |
    学生端使用 X-Student-Id。维护接口只接受本机回环来源且不校验口令；
    除题库切换外，其余管理接口仍需 X-Admin-Token。交卷前任何学生端响应都不得包含
    answer 或 explanation。服务绑定 0.0.0.0，便于局域网真机访问。
servers:
  - url: http://localhost:8000/api/v1
tags:
  - name: student
  - name: reports
  - name: maintenance
    description: 仅接受 127.0.0.1 / ::1 socket 回环来源；不校验本地口令。
  - name: admin
    description: 来源 socket 对端必须是 127.0.0.1 或 ::1；除题库切换外仍校验 X-Admin-Token。不得使用 X-Forwarded-For。
components:
  securitySchemes:
    StudentId:
      type: apiKey
      in: header
      name: X-Student-Id
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: 仅由本机回环地址提交；值来自 .env 的 ADMIN_TOKEN，使用 secrets.compare_digest 比较。
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              example: BANK_NOT_ACTIVE
            message:
              type: string
            request_id:
              type: string
              format: uuid
            details:
              type: object
              additionalProperties: true
    StartPracticeRequest:
      type: object
      additionalProperties: false
      required: [duration_minutes]
      properties:
        duration_minutes:
          type: integer
          enum: [30, 60]
    SessionResponse:
      $ref: ./schemas/session.json
    ReviewResponse:
      type: object
      additionalProperties: false
      required: [session_id, bank_id, bank_name, bank_version, status, items]
      properties:
        session_id:
          type: string
          format: uuid
        bank_id:
          type: string
          format: uuid
        bank_name:
          type: string
        bank_version:
          type: string
        status:
          type: string
          enum: [submitted, expired]
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - question_id
              - type
              - passage_group_id
              - passage
              - stem
              - options
              - saved_answer
              - presentation_mode
              - blank_label
              - passage_order
              - question_order
              - book_tag
              - correct
              - correct_answer
            properties:
              question_id:
                type: string
              type:
                type: string
                enum: [cloze, grammar_fill, reading, gap_fill]
              passage_group_id:
                type: string
              passage:
                type: string
              stem:
                type: string
              options:
                type: array
                items:
                  type: string
              saved_answer:
                oneOf:
                  - type: "null"
                  - type: string
              presentation_mode:
                type: string
                enum: [cloze_single_choice, passage_single_choice, seven_choice, reading_single_choice]
              blank_label:
                type: string
              passage_order:
                type: integer
                minimum: 1
              question_order:
                type: integer
                minimum: 1
              book_tag:
                type: string
                enum: [必修, 选必一, 选必二, 跨册]
              correct:
                type: boolean
              correct_answer:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
    SavedAnswer:
      $ref: ./schemas/answer.json
    Report:
      $ref: ./schemas/report.json
    StageReport:
      type: object
      additionalProperties: false
      required:
        - practice_count
        - average_accuracy
        - total_questions
        - type_trends
        - trend_slope
        - mastery_matrix
        - cleared_errors
        - active_errors
        - accuracy_stddev
        - conclusion
        - action_plan_4_weeks
        - cross_bank_notice
      properties:
        practice_count:
          type: integer
          minimum: 0
        average_accuracy:
          type: number
          minimum: 0
          maximum: 1
        total_questions:
          type: integer
          minimum: 0
        type_trends:
          type: object
          additionalProperties:
            type: array
            items:
              type: number
        trend_slope:
          type: number
        mastery_matrix:
          type: array
          items:
            type: object
            additionalProperties: true
        cleared_errors:
          type: integer
          minimum: 0
        active_errors:
          type: integer
          minimum: 0
        accuracy_stddev:
          type: number
          minimum: 0
        conclusion:
          type: string
        action_plan_4_weeks:
          type: array
          items:
            type: string
        cross_bank_notice:
          oneOf:
            - type: "null"
            - type: string
    ErrorTag:
      $ref: ./schemas/error-tag.json
    Bank:
      $ref: ./schemas/bank.json
    CreateBankRequest:
      type: object
      additionalProperties: false
      required: [name, target_size, difficulty_profile]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        target_size:
          type: integer
          minimum: 1
        difficulty_profile:
          type: string
          enum: [standard, foundation, advanced]
    StartGenerationRequest:
      type: object
      additionalProperties: false
      properties:
        batch_size:
          type: integer
          minimum: 1
          maximum: 10
          default: 10
      description: 服务端必须存在绑定该 Bank 的有效审批记录；本请求不接受客户端布尔批准。
    GenerationApprovalRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    GenerationApproval:
      type: object
      additionalProperties: false
      required: [approval_id, bank_id, approved_at, expires_at, used]
      properties:
        approval_id:
          type: string
          format: uuid
        bank_id:
          type: string
          format: uuid
        approved_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        used:
          type: boolean
    GenerationJob:
      type: object
      additionalProperties: false
      required:
        - job_id
        - bank_id
        - status
        - completed_passages
        - target_passages
        - first_batch_verified
        - rejected_count
        - batches
        - created_at
      properties:
        job_id:
          type: string
          format: uuid
        bank_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, paused_for_review, paused_for_owner, completed, failed]
        completed_passages:
          type: integer
          minimum: 0
        target_passages:
          type: integer
          minimum: 1
        first_batch_verified:
          type: boolean
        rejected_count:
          type: integer
          minimum: 0
        batches:
          type: array
          items:
            type: object
            additionalProperties: true
        created_at:
          type: string
          format: date-time
    Coverage:
      type: object
      additionalProperties: true
    MistakeEntry:
      type: object
      additionalProperties: false
      required:
        - question_id
        - passage_id
        - question_type
        - label
        - wrong_count
        - correct_streak
        - status
      properties:
        question_id:
          type: string
        passage_id:
          oneOf:
            - type: "null"
            - type: string
        question_type:
          type: string
          enum: [cloze, grammar, reading, seven]
        label:
          type: string
        wrong_count:
          type: integer
          minimum: 1
        correct_streak:
          type: integer
          minimum: 0
          maximum: 2
        status:
          type: string
          enum: [open, mastered]
    MistakePassageGroup:
      type: object
      additionalProperties: false
      required: [passage_id, question_type, items]
      properties:
        passage_id:
          type: string
        question_type:
          type: string
          enum: [cloze, grammar, reading, seven]
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MistakeEntry"
    MistakeBankGroup:
      type: object
      additionalProperties: false
      required: [bank_id, bank_name, count, passages]
      properties:
        bank_id:
          type: string
          format: uuid
        bank_name:
          type: string
        count:
          type: integer
          minimum: 0
        passages:
          type: array
          items:
            $ref: "#/components/schemas/MistakePassageGroup"
    MistakeListResponse:
      type: object
      additionalProperties: false
      required: [current_bank, history_banks, total_open]
      properties:
        current_bank:
          $ref: "#/components/schemas/MistakeBankGroup"
        history_banks:
          type: array
          items:
            $ref: "#/components/schemas/MistakeBankGroup"
        total_open:
          type: integer
          minimum: 0
    CoverageStats:
      type: object
      additionalProperties: false
      required: [total, none, once, twice_plus, bank_name, as_of]
      properties:
        total:
          type: integer
          minimum: 0
        none:
          type: integer
          minimum: 0
        once:
          type: integer
          minimum: 0
        twice_plus:
          type: integer
          minimum: 0
        bank_name:
          type: string
        as_of:
          type: string
          format: date-time
    ClearPreview:
      type: object
      additionalProperties: false
      required: [count, bank_name]
      properties:
        count:
          type: integer
          minimum: 0
        bank_name:
          type: string
        history_count:
          type: integer
          minimum: 0
        question_total:
          type: integer
          minimum: 0
    MaintenanceResult:
      type: object
      additionalProperties: false
      required: [deleted_count]
      properties:
        deleted_count:
          type: integer
          minimum: 0
    SwitchableBank:
      type: object
      additionalProperties: false
      required:
        - bank_id
        - name
        - version
        - question_count
        - status
        - is_current
      properties:
        bank_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          minimum: 1
        question_count:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [active, ready, archived]
        is_current:
          type: boolean
    SwitchableBanks:
      type: object
      additionalProperties: false
      required: [current_bank_id, in_progress_count, banks]
      properties:
        current_bank_id:
          type: string
          format: uuid
        in_progress_count:
          type: integer
          minimum: 0
        banks:
          type: array
          items:
            $ref: "#/components/schemas/SwitchableBank"
    ImportIssue:
      type: object
      additionalProperties: true
      required: [code]
      properties:
        code:
          type: string
        message:
          type: string
        passage_id:
          type: [string, "null"]
        question_index:
          type: [integer, "null"]
        sample: {}
    SemanticAudit:
      type: object
      additionalProperties: false
      required: [valid, cost_cny]
      properties:
        valid:
          type: boolean
        cost_cny:
          type: number
          minimum: 0
        failures:
          type: array
          items:
            $ref: "#/components/schemas/ImportIssue"
        audited_passages:
          type: integer
          minimum: 0
        budget_cap_cny:
          type: number
          minimum: 0
        budget_exceeded:
          type: boolean
    ImportComposition:
      type: object
      additionalProperties: false
      required: [cloze, grammar_fill, reading, gap_fill]
      properties:
        cloze:
          type: integer
          minimum: 0
        grammar_fill:
          type: integer
          minimum: 0
        reading:
          type: integer
          minimum: 0
        gap_fill:
          type: integer
          minimum: 0
    BankImportSummary:
      type: object
      additionalProperties: false
      required: [name, target_size, passages, questions, composition]
      properties:
        name:
          type: string
        target_size:
          type: integer
          minimum: 1
        passages:
          type: integer
          minimum: 1
        questions:
          type: integer
          minimum: 1
        composition:
          $ref: "#/components/schemas/ImportComposition"
    BankImportPreview:
      type: object
      additionalProperties: false
      required: [valid, summary, errors]
      properties:
        valid:
          type: boolean
        summary:
          $ref: "#/components/schemas/BankImportSummary"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportIssue"
        semantic_audit:
          $ref: "#/components/schemas/SemanticAudit"
    BankImportResult:
      type: object
      additionalProperties: false
      required: [bank_id, name, status, previous_bank_id, summary]
      properties:
        bank_id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active]
        previous_bank_id:
          type: [string, "null"]
          format: uuid
        summary:
          type: object
          additionalProperties: false
          required: [passages, questions, composition]
          properties:
            passages:
              type: integer
              minimum: 1
            questions:
              type: integer
              minimum: 1
            composition:
              $ref: "#/components/schemas/ImportComposition"
        semantic_audit:
          $ref: "#/components/schemas/SemanticAudit"
    BankDeletePreview:
      type: object
      additionalProperties: false
      required:
        - bank_id
        - name
        - status
        - passages
        - questions
        - sessions
        - reports
        - attempts
        - mistakes
        - can_delete
        - blocking_reason
      properties:
        bank_id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [draft, generating, reviewing, ready, active, archived]
        passages:
          type: integer
          minimum: 0
        questions:
          type: integer
          minimum: 0
        sessions:
          type: integer
          minimum: 0
        reports:
          type: integer
          minimum: 0
        attempts:
          type: integer
          minimum: 0
        mistakes:
          type: integer
          minimum: 0
        can_delete:
          type: boolean
        blocking_reason:
          type: [string, "null"]
    PreviewResponse:
      type: object
      additionalProperties: false
      required: [bank_id, items]
      properties:
        bank_id:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: ./schemas/question.json
    BankComparison:
      type: object
      additionalProperties: false
      required: [left, right]
      properties:
        left:
          type: object
          additionalProperties: false
          required: [bank, coverage, preview]
          properties:
            bank:
              $ref: ./schemas/bank.json
            coverage:
              $ref: "#/components/schemas/Coverage"
            preview:
              $ref: "#/components/schemas/PreviewResponse"
        right:
          type: object
          additionalProperties: false
          required: [bank, coverage, preview]
          properties:
            bank:
              $ref: ./schemas/bank.json
            coverage:
              $ref: "#/components/schemas/Coverage"
            preview:
              $ref: "#/components/schemas/PreviewResponse"
    QuestionReviewRequest:
      type: object
      additionalProperties: false
      required: [bank_id, question_ids, decision]
      properties:
        bank_id:
          type: string
          format: uuid
        question_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        decision:
          type: string
          enum: [approve, reject, edit]
        reason:
          type: string
        edits:
          type: object
          additionalProperties: false
          properties:
            stem:
              type: string
              minLength: 1
            options:
              oneOf:
                - type: "null"
                - type: array
                  items:
                    type: string
            answer:
              $ref: ./schemas/common.json#/$defs/answerValue
            explanation:
              type: string
              minLength: 1
            knowledge_points:
              type: array
              items:
                type: string
            grammar_tags:
              type: array
              items:
                type: string
  responses:
    ErrorResponse:
      description: 统一错误响应
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoContent:
      description: 操作成功，无响应体
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BankId:
      name: bank_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一会话的重试必须复用该 UUID；重复提交返回首次结果。
      schema:
        type: string
        format: uuid
paths:
  /bank/active:
    get:
      tags: [student]
      operationId: getActiveBank
      security:
        - StudentId: []
      summary: 获取当前 active Bank 的只读信息
      responses:
        "200":
          description: 当前生效 Bank
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [bank_id, name, status]
                properties:
                  bank_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  status:
                    type: string
                    enum: [active]
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /practice/start:
    post:
      tags: [student]
      operationId: startPractice
      security:
        - StudentId: []
      summary: 从 active Bank 为新会话组卷
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPracticeRequest"
      responses:
        "201":
          description: 创建完成；响应不含答案与解析
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /practice/{session_id}:
    get:
      tags: [student]
      operationId: getPracticeSession
      security:
        - StudentId: []
      summary: 获取会话、服务端剩余时间和进度
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: 会话详情；答案和解析仍不返回
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [student]
      operationId: abandonPractice
      security:
        - StudentId: []
      summary: 退出并删除未交卷会话及其题目快照和作答，不生成报告
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /practice/{session_id}/review:
    get:
      tags: [student]
      operationId: getPracticeReview
      security:
        - StudentId: []
      summary: 获取已交卷会话的原题、我的选择和逐题对错；不返回解析
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: 只读回顾数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /practice/{session_id}/answer:
    put:
      tags: [student]
      operationId: saveAnswer
      security:
        - StudentId: []
      summary: 暂存单题答案
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedAnswer"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /practice/{session_id}/submit:
    post:
      tags: [student]
      operationId: submitPractice
      security:
        - StudentId: []
      summary: 交卷、判分并返回逐题解析与单次报告；重复幂等返回同一结果
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 首次交卷结果或相同幂等键对应的同一结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /reports/{session_id}:
    get:
      tags: [reports]
      operationId: getReport
      security:
        - StudentId: []
      summary: 获取绑定原 Bank 的单次报告
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: 单次报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [reports]
      operationId: deleteReport
      security:
        - StudentId: []
      summary: 删除该学生的一份历史报告及其题目和作答快照
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /reports:
    get:
      tags: [reports]
      operationId: listReports
      security:
        - StudentId: []
      summary: 列出该学生的历史报告
      responses:
        "200":
          description: 按创建时间倒序排列的历史报告
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [session_id, report_title, question_count, score, created_at]
                  properties:
                    session_id:
                      type: string
                      format: uuid
                    report_title:
                      type: string
                    question_count:
                      type: integer
                    score:
                      type: number
                    created_at:
                      type: string
                      format: date-time
  /reports/summary:
    get:
      tags: [reports]
      operationId: getStageReport
      security:
        - StudentId: []
      summary: 获取最近 10 次或每 5 次触发的阶段总结
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [last5, last10]
            default: last10
      responses:
        "200":
          description: 阶段报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageReport"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /error-tags:
    get:
      tags: [student]
      operationId: listErrorTags
      security:
        - StudentId: []
      summary: 获取当前学生的错题标签
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, mastered]
        - name: bank_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 错题标签
          content:
            application/json:
              schema:
                type: array
